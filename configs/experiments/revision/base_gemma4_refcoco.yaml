experiment_id: revision_base
variant: revision_base
seed: 17
output_dir: results/runs
runtime:
  mixed_precision: bf16
  expected_world_size: 2
  require_cuda: true
  require_a100: true
  min_free_disk_gb: 10
backbone:
  kind: hf
  model_id: ${oc.env:GEMMA4_MODEL_PATH,google/gemma-4-E2B-it}
  torch_dtype: bfloat16
  device_map: null
  load_in_4bit: false
  trust_remote_code: false
  gradient_checkpointing: true
  use_chat_template: true
dataset:
  name: refcoco
  image_root: data/refcoco
  splits:
    train: data/refcoco/manifests/refcoco_train.jsonl
    val: data/refcoco/manifests/refcoco_val.jsonl
    testA: data/refcoco/manifests/refcoco_testA.jsonl
    testB: data/refcoco/manifests/refcoco_testB.jsonl
  train_split: train
  eval_split: val
  limit: null
training:
  batch_size: 1
  global_batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false
  max_steps: 3000
  gradient_accumulation_steps: 8
  lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  freeze_backbone: true
  save_every: 3000
  resume_from: null
logging:
  tracker: null
  project_name: coground-vlm
  log_every: 10
lora:
  enabled: false
method:
  enabled: true
  dim: auto
  layer_tap: 0
  k: 16
  num_patch_clusters: 16
  num_token_clusters: 16
  hidden_dim: 1024
  affinity_mode: bilinear
  assignment_mode: soft
  temperature: 1.0
  block_solver: least_squares
  block_ablation: none
  block_rcond: 1.0e-5
  detach_reconstruction_affinity: true
grounding_baseline:
  enabled: false
  dim: auto
  layer_tap: 0
  mode: matched_mlp
  hidden_dim: 1024
  rank: 16
  dropout: 0.0
  grounding_weight: 1.0
target_control:
  mode: none
losses:
  lambda_task: 0.0
  lambda_cc: 1.0
  lambda_recon: 1.0
  lambda_entropy: 0.01
  lambda_balance: 0.1
  lambda_ground: 1.0
  lambda_dec: 0.0
  grounding_pos_weight: auto
  grounding_max_pos_weight: 100.0
decoding:
  enabled: false
  lambda_dec: 0.0
  hidden_dim: null
  mode: vocab_logit_bias
  require_true_attention_bias: false
  stopgrad_assignments: true
  share_assignments: true
  normalize_prior: true
  plausibility_top_k: 128
  plausibility_floor: 0.0
  vocab_chunk_size: 4096
baseline:
  name: none
generation:
  max_new_tokens: 48
  do_sample: false
  temperature: 1.0
eval:
  batch_size: 1
  num_workers: 2
