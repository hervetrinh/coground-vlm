[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coground-vlm"
version = "0.1.0"
description = "Differentiable patch-token co-clustering for visual grounding."
authors = [{ name = "Hervé Trinh", email = "trinh.herve@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "accelerate>=1.1",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "peft>=0.11",
  "pillow>=10.0",
  "requests>=2.32",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.57.0",
  "scipy>=1.10",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "huggingface-hub>=0.24"
]

[project.urls]
Repository = "https://github.com/hervetrinh/coground-vlm"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17.3"]
gemma4 = ["transformers>=5.5.0"]
quantization = ["bitsandbytes>=0.43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]  # Standalone scripts add the src directory before local imports.
